<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Khushi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #d1d5db;
      overscroll-behavior: none;
    }

    /* Fixed 45-degree gradient: bottom-left black to top-right pink */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(to top right, #000000 0%, #3b0f25 52%, #9c2961 100%);
      transform: translate3d(0, 0, 0);
    }

    /* Isolated GPU-Composited Floating Hearts Layer */
    .hearts-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
      transform: translate3d(0, 0, 0);
    }

    .heart-wrap {
      position: absolute;
      bottom: -70px;
      will-change: transform, opacity;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      animation: floatUp linear infinite;
    }

    .heart-svg {
      display: block;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      animation: bobbleSway ease-in-out infinite alternate;
    }

    @keyframes floatUp {
      0% {
        transform: translate3d(0, 0, 0) scale(0.85);
        opacity: 0;
      }
      12% {
        opacity: var(--max-opacity, 0.78);
      }
      85% {
        opacity: var(--max-opacity, 0.78);
      }
      100% {
        transform: translate3d(0, calc(-100vh - 140px), 0) scale(1.05);
        opacity: 0;
      }
    }

    @keyframes bobbleSway {
      0% {
        transform: translate3d(calc(var(--sway, 14px) * -1), 0, 0) rotate(-6deg) scale(0.96);
      }
      100% {
        transform: translate3d(var(--sway, 14px), 0, 0) rotate(6deg) scale(1.02);
      }
    }

    /* Opening Intro Overlay (Before Anything Starts) */
    .intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 24px;
      text-align: center;
      background: rgba(10, 2, 6, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 1;
      transform: scale(1) translate3d(0, 0, 0);
      transition:
        opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      touch-action: manipulation;
    }

    .intro-overlay.is-hidden {
      opacity: 0;
      transform: scale(1.04) translate3d(0, 0, 0);
      pointer-events: none;
    }

    .intro-title {
      font-size: clamp(2.5rem, 10vw, 3.6rem);
      line-height: 1.25;
      padding: 6px 16px;
    }

    .intro-play-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(156, 41, 97, 0.85), rgba(45, 10, 28, 0.95));
      border: 1.5px solid rgba(245, 194, 220, 0.55);
      color: #f5c2dc;
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.75),
        0 0 26px rgba(196, 56, 124, 0.42);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.25s ease;
    }

    .intro-play-btn::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(245, 194, 220, 0.32);
      animation: playPulse 2s ease-out infinite;
      pointer-events: none;
    }

    .intro-play-btn:active {
      transform: scale(0.92);
    }

    .intro-play-btn svg {
      margin-left: 4px;
    }

    @keyframes playPulse {
      0% {
        transform: scale(0.96);
        opacity: 0.75;
      }
      100% {
        transform: scale(1.32);
        opacity: 0;
      }
    }

    /* Fixed Viewport + Single GPU-Composited Scroll Stage for True 60/120fps */
    .viewport {
      position: fixed;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      touch-action: none;
    }

    .scroll-stage {
      width: 100%;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* Barless Top Title Area */
    .hero-title {
      text-align: center;
      padding: 36px 16px 10px;
    }

    .hero-title h1 {
      display: inline-block;
      padding: 4px 12px;
    }

    /* Great Vibes Gradient Text */
    .script-gradient {
      font-family: "Great Vibes", "Brush Script MT", cursive;
      font-style: italic;
      font-weight: 400;
      background: linear-gradient(45deg, #9c2961 0%, #f5c2dc 45%, #f5c2dc 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .script-gradient-darker {
      font-family: "Great Vibes", "Brush Script MT", cursive;
      font-style: italic;
      font-weight: 400;
      background: linear-gradient(45deg, #681b41 0%, #d49bb8 45%, #d49bb8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-title .line-top {
      display: block;
      font-size: clamp(2.2rem, 9vw, 3rem);
      line-height: 1.2;
      padding: 0 6px;
    }

    .hero-title .line-name {
      display: block;
      font-size: clamp(2.8rem, 11.5vw, 3.8rem);
      line-height: 1.15;
      margin-top: 2px;
      padding: 0 6px;
    }

    /* Closing Script Text Before Upward Arrow Button */
    .closing-wrap {
      text-align: center;
      padding: 12px 8px 0;
    }

    .closing-text {
      display: inline-block;
      font-size: clamp(2.2rem, 9vw, 3rem);
      line-height: 1.2;
      padding: 0 8px;
    }

    /* Main Mobile Container */
    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 28px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 38px;
    }

    /* Card Wrapper */
    .card {
      position: relative;
      width: 88%;
      max-width: 344px;
      margin: 0 auto;
    }

    .card-last {
      margin-bottom: 42px;
    }

    .card:nth-child(odd) {
      --tilt: -2.2deg;
    }

    .card:nth-child(even) {
      --tilt: 2.2deg;
    }

    /* Lightweight Soft Glow Behind Static Card */
    .card-glow {
      position: absolute;
      inset: -18px;
      z-index: 0;
      border-radius: 32px;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        rgba(196, 56, 124, 0.24) 24%,
        rgba(0, 0, 0, 0.45) 58%,
        rgba(0, 0, 0, 0) 78%
      );
      transform: rotate(var(--tilt, -2.2deg)) translate3d(0, 0, 0);
    }

    /* Still Photo Card in Alternating Tilt */
    .card-inner {
      position: relative;
      z-index: 1;
      border-radius: 18px;
      overflow: hidden;
      transform: rotate(var(--tilt, -2.2deg)) translate3d(0, 0, 0);
      transform-origin: center center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* Pure Radial-Gradient Black Vignette */
    .card-inner::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: 18px;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0) 48%,
        rgba(0, 0, 0, 0.36) 75%,
        rgba(0, 0, 0, 0.88) 100%
      );
    }

    /* Vertical Portrait Photo */
    .section-photo {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      object-position: center 22%;
      border-radius: 18px;
      border: none;
      background: linear-gradient(145deg, #2a0a1a, #12040b);
    }

    /* Overlapping Corner Stickers */
    .corner-sticker {
      position: absolute;
      z-index: 4;
      pointer-events: none;
      transform-origin: center center;
    }

    .corner-sticker svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .sticker-tr {
      top: -30px;
      right: -16px;
      width: 86px;
      height: 86px;
      transform: rotate(10deg) translate3d(0, 0, 0);
    }

    .sticker-tl {
      top: -30px;
      left: -16px;
      width: 88px;
      height: 88px;
      transform: rotate(-10deg) translate3d(0, 0, 0);
    }

    .sticker-bmw {
      top: -26px;
      right: -14px;
      width: 76px;
      height: 76px;
      transform: rotate(10deg) translate3d(0, 0, 0);
    }

    .sticker-hb {
      top: -28px;
      right: -16px;
      width: 112px;
      height: 86px;
      transform: rotate(9deg) translate3d(0, 0, 0);
    }

    /* Static Visible Text Near Last Photo */
    .pop-wish {
      position: absolute;
      left: -6%;
      right: -6%;
      top: calc(100% + 12px);
      z-index: 3;
      text-align: center;
      pointer-events: none;
      font-size: clamp(1.25rem, 4.8vw, 1.55rem);
      line-height: 1.25;
      padding: 0 8px;
    }

    /* Small Circular Upward Arrow Button */
    .top-circle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      margin: 4px auto 0;
      border-radius: 50%;
      background: rgba(12, 4, 8, 0.88);
      border: 1px solid rgba(245, 194, 220, 0.28);
      color: #f5c2dc;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.65);
      transition:
        transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
        background-color 0.25s ease;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }

    .top-circle-btn:active {
      transform: scale(0.92);
      background: rgba(79, 24, 51, 0.85);
    }

    /* Footer Signature + Realistic Pumping Heart */
    .footer-note {
      text-align: center;
      padding: 0 12px 28px;
      margin-top: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.85rem;
      font-weight: 400;
      line-height: 1.7;
      color: #f48fb1;
      letter-spacing: 0.2px;
    }

    .footer-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .real-heart {
      display: inline-block;
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform-origin: center center;
      animation: realHeartPump 1.2s cubic-bezier(0.37, 0, 0.63, 1) infinite;
    }

    @keyframes realHeartPump {
      0%   { transform: translate3d(0, 0, 0) scale(0.86); }
      14%  { transform: translate3d(0, 0, 0) scale(1.05); }
      28%  { transform: translate3d(0, 0, 0) scale(0.90); }
      42%  { transform: translate3d(0, 0, 0) scale(1.01); }
      70%  { transform: translate3d(0, 0, 0) scale(0.86); }
      100% { transform: translate3d(0, 0, 0) scale(0.86); }
    }
  </style>
</head>
<body>

  <!-- Birthday Song Audio (Save your file as song.mp3 in the same folder) -->
  <audio id="bgSong" src="song.mp3" preload="auto" playsinline></audio>

  <div class="bg-layer" aria-hidden="true"></div>

  <!-- Shared SVG Gradients for 3D Dark Pink Hearts -->
  <svg width="0" height="0" style="position:absolute; visibility:hidden;" aria-hidden="true">
    <defs>
      <radialGradient id="heartGrad0" cx="35%" cy="28%" r="72%" fx="30%" fy="24%">
        <stop offset="0%" stop-color="#8c2456" />
        <stop offset="50%" stop-color="#591637" />
        <stop offset="100%" stop-color="#360c21" />
      </radialGradient>

      <radialGradient id="heartGrad1" cx="32%" cy="26%" r="74%" fx="28%" fy="22%">
        <stop offset="0%" stop-color="#7a1e4b" />
        <stop offset="52%" stop-color="#4d1330" />
        <stop offset="100%" stop-color="#2e0a1c" />
      </radialGradient>

      <radialGradient id="heartGrad2" cx="38%" cy="30%" r="70%" fx="34%" fy="25%">
        <stop offset="0%" stop-color="#9c2961" />
        <stop offset="48%" stop-color="#63193d" />
        <stop offset="100%" stop-color="#3b0e24" />
      </radialGradient>
    </defs>
  </svg>

  <!-- Background Flying Hearts -->
  <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>

  <!-- Welcome Overlay Shown First Before Anything Starts -->
  <div class="intro-overlay" id="introOverlay">
    <p class="intro-title script-gradient">Celebrate The Birthday !</p>
    <button type="button" class="intro-play-btn" id="introPlayBtn" aria-label="Play Birthday Celebration">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <polygon points="6,3 20,12 6,21" />
      </svg>
    </button>
  </div>

  <!-- Smooth GPU Scroll Viewport -->
  <div class="viewport" id="viewport">
    <div class="scroll-stage" id="scrollStage">
      <div class="hero-title">
        <h1>
          <span class="line-top script-gradient">Happy Birthday</span>
          <span class="line-name script-gradient">Khushi</span>
        </h1>
      </div>

      <main class="container">
        <!-- PHOTO 1: 4-Candle Cake on TOP-RIGHT -->
        <section class="card">
          <div class="card-glow" aria-hidden="true"></div>
          <div class="card-inner">
            <img src="photo1.jpg" alt="Khushi 1" class="section-photo" decoding="async" loading="eager" />
          </div>
          <div class="corner-sticker sticker-tr" aria-hidden="true">
            <svg viewBox="0 0 120 120">
              <defs>
                <linearGradient id="cakeBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#632e31" />
                  <stop offset="100%" stop-color="#451e20" />
                </linearGradient>
                <pattern id="stripeOrange" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(42)">
                  <rect width="6" height="6" fill="#d94f30" />
                  <rect width="2.2" height="6" fill="#f7efe8" />
                </pattern>
                <pattern id="stripePurple" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(42)">
                  <rect width="6" height="6" fill="#7c56b8" />
                  <rect width="2.2" height="6" fill="#f7efe8" />
                </pattern>
                <pattern id="stripeMint" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(42)">
                  <rect width="6" height="6" fill="#59bf9e" />
                  <rect width="2.2" height="6" fill="#f7efe8" />
                </pattern>
                <pattern id="stripeBlue" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(42)">
                  <rect width="6" height="6" fill="#4982b8" />
                  <rect width="2.2" height="6" fill="#f2dc7e" />
                </pattern>
              </defs>
              <ellipse cx="60" cy="108" rx="41" ry="6" fill="rgba(0, 0, 0, 0.45)" />
              <path d="M20 82 L100 82 L99 102 C99 106, 84 108, 60 108 C36 108, 21 106, 21 102 Z" fill="url(#cakeBaseGrad)" />

              <path d="M86.9 37.2 C88.3 39.5, 88.4 42, 86.9 43.2 C85.4 42, 85.5 39.5, 86.9 37.2 Z" fill="#fff7c2" />
            </svg>
          </div>
        </section>

        <!-- PHOTO 2: Cake Slice on Blue Plate on TOP-LEFT -->
        <section class="card">
          <div class="card-glow" aria-hidden="true"></div>
          <div class="card-inner">
            <img src="photo2.jpg" alt="Khushi 2" class="section-photo" decoding="async" loading="eager" />
          </div>
          <div class="corner-sticker sticker-tl" aria-hidden="true">
            <svg viewBox="0 0 120 120">
              <ellipse cx="60" cy="95" rx="46" ry="18" fill="rgba(0, 0, 0, 0.42)" />
              <ellipse cx="60" cy="91" rx="44" ry="17" fill="#9ed8e3" stroke="#4c433e" stroke-width="2" />

              <path d="M60.5 23 C62.8 26.2, 63 29.5, 60.5 30.5 C58 29.5, 58.2 26.2, 60.5 23 Z" fill="#ef8f6e" />
            </svg>
          </div>
        </section>

        <!-- PHOTO 3: BMW Logo on TOP-RIGHT -->
        <section class="card">
          <div class="card-glow" aria-hidden="true"></div>
          <div class="card-inner">
            <img src="photo3.jpg" alt="Khushi 3" class="section-photo" decoding="async" loading="eager" />
          </div>
          <div class="corner-sticker sticker-bmw" aria-hidden="true">
            <svg viewBox="0 0 120 120">
              <defs>
                <linearGradient id="bmwRim" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#dce4ea" />
                  <stop offset="50%" stop-color="#8b969e" />
                  <stop offset="100%" stop-color="#566068" />
                </linearGradient>
                <radialGradient id="bmwBlack" cx="35%" cy="28%" r="72%">
                  <stop offset="0%" stop-color="#383d42" />
                  <stop offset="45%" stop-color="#111315" />
                  <stop offset="100%" stop-color="#030304" />
                </radialGradient>
                <linearGradient id="bmwBlue" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#57b1e8" />
                  <stop offset="100%" stop-color="#2275b2" />
                </linearGradient>
                <linearGradient id="bmwWhite" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="100%" stop-color="#cfd6dc" />
                </linearGradient>

  <script>
    // Insert 8 lightweight GPU-composited 3D dark pink hearts
    const heartsLayer = document.getElementById("heartsLayer");
    const heartFragment = document.createDocumentFragment();
    const heartCount = 8;

    for (let i = 0; i < heartCount; i++) {
      const wrap = document.createElement("div");
      wrap.className = "heart-wrap";

      const size = 18 + Math.random() * 24;
      const left = (i * 11.5 + Math.random() * 8).toFixed(1);
      const floatDuration = 9.5 + Math.random() * 6;
      const swayDuration = 2.8 + Math.random() * 1.6;
      const delay = -(Math.random() * floatDuration);
      const sway = (10 + Math.random() * 14).toFixed(1) + "px";
      const maxOpacity = (0.55 + Math.random() * 0.32).toFixed(2);
      const gradId = `heartGrad${i % 3}`;

      wrap.style.left = left + "%";
      wrap.style.animationDuration = floatDuration + "s";
      wrap.style.animationDelay = delay + "s";
      wrap.style.setProperty("--max-opacity", maxOpacity);

      wrap.innerHTML = `
        <svg class="heart-svg" width="${size}" height="${size}" viewBox="0 0 24 24"
             style="animation-duration:${swayDuration}s; --sway:${sway};">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
                   2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09
                   C13.09 3.81 14.76 3 16.5 3
                   19.58 3 22 5.42 22 8.5
                   c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                fill="url(#${gradId})" />
          <path d="M5.2 6.8c.7-1.4 2.1-2.1 3.4-1.8.4.1.6.5.4.8-.2.3-.5.4-.9.3-.8-.2-1.7.3-2.2 1.2-.2.3-.5.4-.8.2-.2-.1-.3-.4-.1-.7z"
                fill="rgba(255, 190, 220, 0.18)" />
        </svg>
      `;

      heartFragment.appendChild(wrap);
    }

    heartsLayer.appendChild(heartFragment);

    // Pre-decode images into GPU memory so scrolling stays locked at 60/120fps
    document.querySelectorAll(".section-photo").forEach((img) => {
      if (img.decode) {
        img.decode().catch(() => {});
      }
      img.addEventListener("load", updateBounds, { once: true });
    });

    // Enhanced Audio Loop (Cuts first 2.0 seconds on start and every loop)
    const CUT_START_SEC = 2.0;
    const bgSong = document.getElementById("bgSong");
    const introOverlay = document.getElementById("introOverlay");
    const introPlayBtn = document.getElementById("introPlayBtn");

    let hasStarted = false;
    let audioCtx = null;
    let audioEnhanced = false;

    function initAudioEnhancer() {
      if (audioEnhanced) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        audioCtx = new AudioCtx();
        const source = audioCtx.createMediaElementSource(bgSong);

        const lowShelf = audioCtx.createBiquadFilter();
        lowShelf.type = "lowshelf";
        lowShelf.frequency.value = 110;
        lowShelf.gain.value = 3.5;

        const vocalBoost = audioCtx.createBiquadFilter();
        vocalBoost.type = "peaking";
        vocalBoost.frequency.value = 3000;
        vocalBoost.Q.value = 0.9;
        vocalBoost.gain.value = 2.2;

        const highShelf = audioCtx.createBiquadFilter();
        highShelf.type = "highshelf";
        highShelf.frequency.value = 8500;
        highShelf.gain.value = 2.8;

        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.value = -18;
        compressor.knee.value = 12;
        compressor.ratio.value = 3;
        compressor.attack.value = 0.005;
        compressor.release.value = 0.18;

        const makeupGain = audioCtx.createGain();
        makeupGain.gain.value = 1.15;

        source
          .connect(lowShelf)
          .connect(vocalBoost)
          .connect(highShelf)
          .connect(compressor)
          .connect(makeupGain)
          .connect(audioCtx.destination);

        audioEnhanced = true;
      } catch (e) {
        // Fallback smoothly to standard <audio> playback if Web Audio is restricted
      }
    }

    async function startSongFromCut() {
      initAudioEnhancer();
      if (audioCtx && audioCtx.state === "suspended") {
        await audioCtx.resume().catch(() => {});
      }
      if (bgSong.readyState >= 1 && bgSong.currentTime < CUT_START_SEC) {
        bgSong.currentTime = CUT_START_SEC;
      }
      try {
        await bgSong.play();
        if (bgSong.currentTime < CUT_START_SEC) {
          bgSong.currentTime = CUT_START_SEC;
        }
      } catch (err) {
        // Ignore play errors if audio file is missing
      }
    }

    bgSong.addEventListener("loadedmetadata", () => {
      if (bgSong.currentTime < CUT_START_SEC && bgSong.duration > CUT_START_SEC) {
        bgSong.currentTime = CUT_START_SEC;
      }
    });

    // Loop seamlessly back to 2.0s (skipping first 2 seconds every repeat)
    bgSong.addEventListener("timeupdate", () => {
      if (bgSong.duration && bgSong.currentTime >= bgSong.duration - 0.12) {
        bgSong.currentTime = CUT_START_SEC;
      }
    });

    bgSong.addEventListener("ended", () => {
      if (hasStarted) {
        bgSong.currentTime = CUT_START_SEC;
        bgSong.play().catch(() => {});
      }
    });

    // GPU-Composited Sub-Pixel Auto-Scroll + Smooth Manual Touch/Wheel Loop
    const viewport = document.getElementById("viewport");
    const scrollStage = document.getElementById("scrollStage");
    const backToTopBtn = document.getElementById("backToTopBtn");

    const SCROLL_SPEED_PX_PER_SEC = 40;
    const BOTTOM_PAUSE_MS = 1400;
    const TOP_PAUSE_MS = 700;
    const RETURN_DURATION_MS = 1000;
    const USER_IDLE_RESUME_MS = 1600;

    let maxScroll = 0;
    let virtualY = 0;
    let renderedY = -1;
    let lastFrameTime = null;
    let smoothedDt = 1 / 60;

    let mode = "waiting";
    let modeStartTime = performance.now();
    let returnStartY = 0;
    let resumeTimer = null;

    let lastTouchY = 0;
    let lastTouchTime = 0;
    let velocity = 0;

    function clamp(val, min, max) {
      return val < min ? min : val > max ? max : val;
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function updateBounds() {
      maxScroll = Math.max(0, scrollStage.scrollHeight - viewport.clientHeight);
      virtualY = clamp(virtualY, 0, maxScroll);
    }

    function scheduleAutoResume() {
      clearTimeout(resumeTimer);
      resumeTimer = setTimeout(() => {
        if (hasStarted && mode === "user-paused") {
          mode = virtualY >= maxScroll - 1 ? "bottom-pause" : "scrolling";
          modeStartTime = performance.now();
        }
      }, USER_IDLE_RESUME_MS);
    }

    // Play Button Click: Start Song (from 2s), Reveal Page, Begin Auto-Scroll
    introPlayBtn.addEventListener("click", () => {
      if (hasStarted) return;
      hasStarted = true;
      startSongFromCut();
      introOverlay.classList.add("is-hidden");
      setTimeout(() => {
        introOverlay.style.display = "none";
      }, 600);
      mode = "top-pause";
      modeStartTime = performance.now();
    });

    viewport.addEventListener("touchstart", (e) => {
      if (!hasStarted || e.touches.length !== 1) return;
      clearTimeout(resumeTimer);
      mode = "dragging";
      velocity = 0;
      lastTouchY = e.touches[0].clientY;
      lastTouchTime = performance.now();
    }, { passive: true });

    viewport.addEventListener("touchmove", (e) => {
      if (!hasStarted || mode !== "dragging" || e.touches.length !== 1) return;
      const y = e.touches[0].clientY;
      const now = performance.now();
      const dy = lastTouchY - y;
      const dtMs = Math.max(1, now - lastTouchTime);

      virtualY = clamp(virtualY + dy, 0, maxScroll);
      const instVel = (dy / dtMs) * 1000;
      velocity = velocity * 0.4 + instVel * 0.6;

      lastTouchY = y;
      lastTouchTime = now;
    }, { passive: true });

    function onTouchEnd() {
      if (!hasStarted || mode !== "dragging") return;
      if (performance.now() - lastTouchTime > 80) {
        velocity = 0;
      }
      if (Math.abs(velocity) > 35) {
        mode = "inertia";
      } else {
        velocity = 0;
        mode = "user-paused";
        scheduleAutoResume();
      }
    }

    viewport.addEventListener("touchend", onTouchEnd, { passive: true });
    viewport.addEventListener("touchcancel", onTouchEnd, { passive: true });

    viewport.addEventListener("wheel", (e) => {
      if (!hasStarted) return;
      e.preventDefault();
      clearTimeout(resumeTimer);
      velocity = 0;
      const multiplier = e.deltaMode === 1 ? 32 : e.deltaMode === 2 ? viewport.clientHeight : 1;
      virtualY = clamp(virtualY + e.deltaY * multiplier, 0, maxScroll);
      mode = "user-paused";
      scheduleAutoResume();
    }, { passive: false });

    window.addEventListener("keydown", (e) => {
      if (!hasStarted) return;
      let step = 0;
      if (e.key === "ArrowDown") step = 60;
      else if (e.key === "ArrowUp") step = -60;
      else if (e.key === "PageDown" || e.key === " ") step = viewport.clientHeight * 0.75;
      else if (e.key === "PageUp") step = -viewport.clientHeight * 0.75;
      else return;

      e.preventDefault();
      clearTimeout(resumeTimer);
      velocity = 0;
      virtualY = clamp(virtualY + step, 0, maxScroll);
      mode = "user-paused";
      scheduleAutoResume();
    });

    backToTopBtn.addEventListener("click", (e) => {
      if (!hasStarted) return;
      e.stopPropagation();
      clearTimeout(resumeTimer);
      velocity = 0;
      returnStartY = virtualY;
      mode = "returning";
      modeStartTime = performance.now();
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        lastFrameTime = null;
      }
    });

    window.addEventListener("resize", updateBounds, { passive: true });
    window.addEventListener("load", updateBounds);
    updateBounds();

    function renderLoop(now) {
      if (lastFrameTime === null) {
        lastFrameTime = now;
      }

      const rawDt = (now - lastFrameTime) / 1000;
      lastFrameTime = now;

      if (rawDt > 0.002 && rawDt < 0.04) {
        smoothedDt = smoothedDt * 0.85 + rawDt * 0.15;
      }
      const dt = Math.min(0.05, rawDt < 0.04 ? smoothedDt : rawDt);

      if (!document.hidden && hasStarted) {
        if (mode === "top-pause") {
          if (now - modeStartTime >= TOP_PAUSE_MS) {
            mode = "scrolling";
          }
        } else if (mode === "scrolling") {
          virtualY += SCROLL_SPEED_PX_PER_SEC * dt;
          if (virtualY >= maxScroll) {
            virtualY = maxScroll;
            mode = "bottom-pause";
            modeStartTime = now;
          }
        } else if (mode === "bottom-pause") {
          if (now - modeStartTime >= BOTTOM_PAUSE_MS) {
            returnStartY = virtualY;
            mode = "returning";
            modeStartTime = now;
          }
        } else if (mode === "returning") {
          const progress = Math.min(1, (now - modeStartTime) / RETURN_DURATION_MS);
          virtualY = returnStartY * (1 - easeInOutCubic(progress));
          if (progress >= 1) {
            virtualY = 0;
            mode = "top-pause";
            modeStartTime = now;
          }
        } else if (mode === "inertia") {
          virtualY += velocity * dt;
          velocity *= Math.pow(0.93, dt * 60);

          if (virtualY <= 0) {
            virtualY = 0;
            velocity = 0;
          } else if (virtualY >= maxScroll) {
            virtualY = maxScroll;
            velocity = 0;
          }

          if (Math.abs(velocity) < 12) {
            velocity = 0;
            mode = "user-paused";
            scheduleAutoResume();
          }
        }

        if (Math.abs(virtualY - renderedY) > 0.001) {
          renderedY = virtualY;
          scrollStage.style.transform = `translate3d(0, ${(-renderedY).toFixed(3)}px, 0)`;
        }
      }

      requestAnimationFrame(renderLoop);
    }

    requestAnimationFrame(renderLoop);
  </script>
